name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Persistent Signing Certificate (First Run Only)
        run: |
          if [ ! -f app/xdown-signing.jks ]; then
            keytool -genkeypair -v \
              -keystore app/xdown-signing.jks \
              -alias xdown_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass xdown2026password \
              -keypass xdown2026password \
              -dname "CN=XDown, OU=Mobile, O=83P, L=AlHofuf, S=Eastern, C=SA"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/xdown-signing.jks
            git commit -m "Add persistent app signing certificate [skip ci]"
            git push
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --scan

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XMediaDownloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
